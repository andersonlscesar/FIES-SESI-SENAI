spring.application.name=stbp-api

# Health check (/actuator/health) para Docker e monitoramento; nada mais é exposto
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Atrás do nginx: usa X-Forwarded-For para obter o IP real (limite de tentativas de login)
server.forward-headers-strategy=native

spring.datasource.url=${STBP_DB_URL:jdbc:postgresql://localhost:5433/stbp}
spring.datasource.username=${STBP_DB_USUARIO:stbp}
spring.datasource.password=${STBP_DB_SENHA:stbp}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Carrega relacionamentos preguiçosos em lote (evita N+1 nas listagens)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Upload de imagens: logo até 1 MB, foto da unidade até 20 MB (validados também na aplicação)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Segredo HMAC dos tokens JWT (mínimo 32 caracteres). Obrigatório fora do perfil dev.
stbp.seguranca.jwt-segredo=${STBP_JWT_SEGREDO:}
stbp.seguranca.jwt-validade=8h
stbp.seguranca.login-tentativas-por-minuto=5
