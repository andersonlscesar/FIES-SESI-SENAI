# Serve o frontend e encaminha /api para a API (mesma origem: sem CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Upload de imagens: a API aceita logo até 1 MB e foto de unidade até 20 MB
    client_max_body_size 21m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicação de página única: qualquer rota cai no index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
